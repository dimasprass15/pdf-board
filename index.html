<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wasl Modul & Kitab Live Board</title>
  
  <!-- Tailwind CSS CDN for Sleek UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- PDF.js CDN (Mozilla) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Supabase JS Client for Instant Realtime Sync -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B1120;
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: none; /* Cegah browser default pull-to-refresh & zoom */
    }

    /* Glassmorphism Classes (Dark Theme Original) */
    .glass-panel {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #E2E8F0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-button:hover, .glass-button:active {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .glass-button.active {
      background: #0F766E;
      border-color: #14B8A6;
      color: #FFFFFF !important;
      box-shadow: 0 0 14px rgba(20, 184, 166, 0.4);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* Laser pointer dot glow */
    .laser-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 12px #EF4444, 0 0 24px #F87171, 0 0 36px #FCA5A5;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease-out;
      z-index: 50;
    }

    /* Container for PDF and overlay drawing canvas */
    #page-viewport-container {
      position: relative;
      display: inline-block;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      overflow: hidden;
      background: #FFFFFF; /* Kanvas Putih Bersih */
    }

    #pdf-render-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF; /* Kanvas Putih Bersih */
    }

    #drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      z-index: 20;
    }

    /* Loading shimmer */
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body class="flex flex-col w-full h-full select-none text-slate-100 bg-[#0B1120]">

  <!-- ========================================================================= -->
  <!-- TOP HEADER (Info Dokumen, Halaman & Status Sync) -->
  <!-- ========================================================================= -->
  <header class="flex items-center justify-between px-3 py-2 border-b border-slate-800/80 bg-slate-900/90 z-40 shrink-0">
    <!-- Left: Info Dokumen & Status -->
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 rounded-lg bg-teal-900/50 border border-teal-500/30 flex items-center justify-center text-teal-400 shrink-0">
        <i class="fa-solid fa-book-quran text-sm"></i>
      </div>
      <div class="min-w-0">
        <h1 id="doc-title" class="text-xs font-bold text-slate-200 truncate">Papan Tulis & Modul Talaqqi</h1>
        <div class="flex items-center gap-1.5 text-[10px] text-slate-400">
          <span id="sync-badge" class="inline-flex items-center gap-1 text-emerald-400 font-semibold">

    <!-- Right: File Picker (Guru Only) / Zoom Controls -->

  </header>

  <!-- ========================================================================= -->
  <!-- MAIN VIEWER & CANVAS AREA (KANVAS POLOS PUTIH) -->
  <!-- ========================================================================= -->
  <main id="viewer-container" class="relative flex-1 w-full h-full overflow-auto flex items-center justify-center p-3 bg-[#0B1120]">
    <!-- Loading Overlay -->
    <div id="loading-spinner" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-950/70 backdrop-blur-sm transition-opacity duration-300">
      <div class="w-10 h-10 border-3 border-teal-500/20 border-t-teal-400 rounded-full animate-spin mb-3"></div>
      <p class="text-xs text-slate-300 font-medium tracking-wide">Memuat Halaman Modul...</p>
    </div>

    <!-- Page Wrapper (White Surface, No Text) -->
    <div id="page-viewport-container">
      <canvas id="pdf-render-canvas"></canvas>
      <canvas id="drawing-canvas"></canvas>
      <div id="laser-pointer" class="laser-dot hidden"></div>
    </div>
  </main>

  <!-- ========================================================================= -->
  <!-- FLOATING ANNOTATION TOOLBAR (GURU ONLY) -->
  <!-- ========================================================================= -->
  <div id="teacher-toolbar" class="absolute bottom-3.5 left-1/2 -translate-x-1/2 z-40 glass-panel px-3 py-1.5 rounded-2xl flex items-center gap-2 shadow-2xl transition-all duration-300">
    <!-- Tool Selector Group -->

    <!-- Color Palette Picker (Kontras Jelas di Atas Putih) -->

      <!-- Hitam / Dark Navy -->

      <!-- Emas / Amber -->

    <!-- Undo & Clear Actions -->

        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button id="btn-clear-page" class="w-8 h-8 rounded-xl glass-button text-slate-300 hover:text-rose-400 flex items-center justify-center text-xs" title="Hapus Semua Coretan Halaman Ini">

      </button>

  </div>

  <!-- Santri Spectator Badge (Santri Only) -->
  <div id="santri-indicator" class="hidden absolute bottom-3.5 left-1/2 -translate-x-1/2 z-40 glass-panel px-3.5 py-1.5 rounded-full flex items-center gap-2 text-xs font-semibold text-emerald-400 shadow-xl">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
    <span>📑 Menyimak Papan Tulis / Modul Ustadz</span>
  </div>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT LOGIC & SUPABASE REALTIME SYNC -->
  <!-- ========================================================================= -->
  <script>
    // Set PDF.js Worker Source
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ---------------------------------------------------------------------------
    // 1. SUPABASE REALTIME CONFIGURATION
    // ---------------------------------------------------------------------------
    const SUPABASE_URL = 'https://gfcvvldfftnjkywfpkey.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmY3Z2bGRmZnRuamt5d2Zwa2V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDMwMDQsImV4cCI6MjEwMzgxOTAwNH0.kZU31m77De0WlCWCz78TbjDBwjdXCCmfov3gdDazHoM';
    
    // Parse URL Query Params (?role=guru&orgId=...&docUrl=...)
    const urlParams = new URLSearchParams(window.location.search);
    const userRole = (urlParams.get('role') || 'guru').toLowerCase(); // 'guru' or 'santri'
    const orgId = urlParams.get('orgId') || '0c130f47-de59-4a68-bb35-fa85758b1ceb';
    const initialDocUrl = urlParams.get('docUrl') || '';
    const isGuru = userRole === 'guru';

    // Inisialisasi Supabase Client
    let supabaseClient = null;
    let realtimeChannel = null;

    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
      console.warn('[Wasl Board] Supabase client init fallback:', e);
    }

    // ---------------------------------------------------------------------------
    // 2. STATE & VARIABLES
    // ---------------------------------------------------------------------------
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 1;
    let currentScale = 1.25;
    let isRendering = false;
    let pageRenderingQueue = null;

    // Drawing State
    let activeTool = 'pen'; // 'hand', 'pen', 'highlighter', 'laser', 'eraser'
    let activeColor = '#0F172A'; // Hitam/Navy default agar kontras jelas di atas kanvas putih
    let isDrawing = false;
    let currentPath = [];
    
    // Strokes grouped by page number: { 1: [stroke1, stroke2], 2: [...] }
    let pageStrokes = {};

    // DOM Elements
    const pdfCanvas = document.getElementById('pdf-render-canvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCanvas = document.getElementById('drawing-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const viewportContainer = document.getElementById('page-viewport-container');
    const laserElement = document.getElementById('laser-pointer');
    const loadingSpinner = document.getElementById('loading-spinner');
    
    const curPageSpan = document.getElementById('current-page-num');
    const totPagesSpan = document.getElementById('total-pages-num');
    const btnPrevPage = document.getElementById('btn-prev-page');
    const btnNextPage = document.getElementById('btn-next-page');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const fileInput = document.getElementById('file-input');
    const teacherToolbar = document.getElementById('teacher-toolbar');
    const santriIndicator = document.getElementById('santri-indicator');
    const roleBadge = document.getElementById('role-badge');

    // UI Role Setup
    if (!isGuru) {
      teacherToolbar.classList.add('hidden');
      santriIndicator.classList.remove('hidden');
      roleBadge.textContent = 'Santri (Menyimak)';
      roleBadge.classList.replace('bg-slate-800', 'bg-emerald-900/60');
      roleBadge.classList.replace('text-slate-300', 'text-emerald-300');
      document.getElementById('btn-upload-label').classList.add('!hidden');
      drawCanvas.style.pointerEvents = 'none'; // Santri tidak bisa corat-coret sendiri
    } else {
      roleBadge.textContent = 'Ustadz (Guru)';
      roleBadge.classList.replace('bg-slate-800', 'bg-amber-900/60');
      roleBadge.classList.replace('text-slate-300', 'text-amber-300');
    }

    // ---------------------------------------------------------------------------
    // 3. PDF RENDERING ENGINE
    // ---------------------------------------------------------------------------
    function loadPdfDocument(source) {
      showLoading(true);
      const loadingTask = (typeof source === 'string') 
        ? pdfjsLib.getDocument({ url: source, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true })
        : pdfjsLib.getDocument({ data: source });

      loadingTask.promise.then(function(pdf) {
        pdfDoc = pdf;
        totalPages = pdf.numPages;
        totPagesSpan.textContent = totalPages;
        currentPage = 1;
        renderPage(currentPage);
        
        // Guru broadcast info dokumen baru
        if (isGuru) {
          broadcastEvent('doc_loaded', { totalPages: totalPages, page: 1 });
        }
      }).catch(function(error) {
        console.error('[Wasl PDF] Gagal memuat PDF:', error);
        showLoading(false);
        createBlankWhiteCanvas();
      });
    }

    function renderPage(pageNum) {
      if (isRendering) {
        pageRenderingQueue = pageNum;
        return;
      }
      isRendering = true;
      showLoading(true);

      pdfDoc.getPage(pageNum).then(function(page) {
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        
        // Sesuaikan skala agar muat pas di layar viewer container
        const container = document.getElementById('viewer-container');
        const containerWidth = container.clientWidth - 24;
        const containerHeight = container.clientHeight - 24;
        
        const scaleX = containerWidth / unscaledViewport.width;
        const scaleY = containerHeight / unscaledViewport.height;
        const fitScale = Math.min(scaleX, scaleY, 2.0); // Batasi max scale agar hemat RAM
        
        const viewport = page.getViewport({ scale: fitScale * currentScale });

        // Set ukuran fisik canvas (DPI optimal 1.5x)
        const dpr = Math.min(window.devicePixelRatio || 1.0, 1.75);
        pdfCanvas.width = Math.floor(viewport.width * dpr);
        pdfCanvas.height = Math.floor(viewport.height * dpr);
        pdfCanvas.style.width = Math.floor(viewport.width) + 'px';
        pdfCanvas.style.height = Math.floor(viewport.height) + 'px';

        drawCanvas.width = Math.floor(viewport.width * dpr);
        drawCanvas.height = Math.floor(viewport.height * dpr);
        drawCanvas.style.width = Math.floor(viewport.width) + 'px';
        drawCanvas.style.height = Math.floor(viewport.height) + 'px';

        viewportContainer.style.width = Math.floor(viewport.width) + 'px';
        viewportContainer.style.height = Math.floor(viewport.height) + 'px';

        // Render PDF page into canvas context
        const renderContext = {
          canvasContext: pdfCtx,
          viewport: viewport,
          transform: [dpr, 0, 0, dpr, 0, 0]
        };

        const renderTask = page.render(renderContext);
        renderTask.promise.then(function() {
          isRendering = false;
          showLoading(false);
          curPageSpan.textContent = pageNum;
          updatePageButtons();
          
          // Re-draw all strokes belonging to this page
          redrawCurrentPageStrokes();

          if (pageRenderingQueue !== null) {
            const nextP = pageRenderingQueue;
            pageRenderingQueue = null;
            renderPage(nextP);
          }
        });
      });
    }

    function showLoading(show) {
      if (show) {
        loadingSpinner.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        loadingSpinner.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    function updatePageButtons() {
      btnPrevPage.disabled = (currentPage <= 1);
      btnNextPage.disabled = (currentPage >= totalPages);
    }

    function goToPage(pageNum) {
      if (pageNum < 1 || pageNum > totalPages || pageNum === currentPage) return;
      currentPage = pageNum;
      renderPage(currentPage);
      if (isGuru) {
        broadcastEvent('page_change', { page: currentPage });
      }
    }

    // ---------------------------------------------------------------------------
    // 4. INTERACTIVE DRAWING & ANNOTATION ENGINE (HTML5 CANVAS)
    // ---------------------------------------------------------------------------
    function getNormalizedPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const normX = (clientX - rect.left) / rect.width;
      const normY = (clientY - rect.top) / rect.height;
      return {
        x: Math.max(0, Math.min(1.0, normX)),
        y: Math.max(0, Math.min(1.0, normY))
      };
    }

    function startDrawing(e) {
      if (!isGuru || activeTool === 'hand') return;
      e.preventDefault();
      const pos = getNormalizedPos(e);

      if (activeTool === 'laser') {
        updateLaserPointer(pos.x, pos.y);
        broadcastEvent('laser_move', { x: pos.x, y: pos.y, active: true });
        return;
      }

      if (activeTool === 'eraser') {
        eraseStrokeAt(pos.x, pos.y);
        return;
      }

      isDrawing = true;
      currentPath = [pos];
    }

    function drawMove(e) {
      if (!isGuru) return;
      const pos = getNormalizedPos(e);

      if (activeTool === 'laser') {
        updateLaserPointer(pos.x, pos.y);
        broadcastEvent('laser_move', { x: pos.x, y: pos.y, active: true });
        return;
      }

      if (!isDrawing) return;
      e.preventDefault();
      currentPath.push(pos);
      
      // Render preview of current drawing stroke
      renderStrokeImmediate(currentPath, activeTool, activeColor);
    }

    function endDrawing(e) {
      if (!isGuru) return;
      
      if (activeTool === 'laser') {
        setTimeout(() => {
          laserElement.classList.add('hidden');
          broadcastEvent('laser_move', { x: 0, y: 0, active: false });
        }, 1200);
        return;
      }

      if (!isDrawing) return;
      isDrawing = false;

      if (currentPath.length > 1) {
        const strokeObject = {
          id: 's_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          tool: activeTool,
          color: activeColor,
          points: currentPath,
          page: currentPage
        };

        if (!pageStrokes[currentPage]) {
          pageStrokes[currentPage] = [];
        }
        pageStrokes[currentPage].push(strokeObject);
        redrawCurrentPageStrokes();

        // Broadcast new stroke to all students (< 50 bytes)
        broadcastEvent('stroke_add', { stroke: strokeObject, page: currentPage });
      }
      currentPath = [];
    }

    function redrawCurrentPageStrokes() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      const strokes = pageStrokes[currentPage] || [];
      strokes.forEach(stroke => {
        renderNormalizedStroke(drawCtx, stroke);
      });
    }

    function renderStrokeImmediate(points, tool, color) {
      if (points.length < 2) return;
      renderNormalizedStroke(drawCtx, { tool: tool, color: color, points: points });
    }

    function renderNormalizedStroke(ctx, stroke) {
      const points = stroke.points;
      if (!points || points.length < 2) return;

      const dpr = Math.min(window.devicePixelRatio || 1.0, 1.75);
      const w = drawCanvas.width;
      const h = drawCanvas.height;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (stroke.tool === 'highlighter') {
        ctx.strokeStyle = stroke.color;
        ctx.globalAlpha = 0.38;
        ctx.lineWidth = 18 * dpr;
      } else {
        // Pen
        ctx.strokeStyle = stroke.color;
        ctx.globalAlpha = 1.0;
        ctx.lineWidth = 3.5 * dpr;
      }

      ctx.beginPath();
      ctx.moveTo(points[0].x * w, points[0].y * h);

      for (let i = 1; i < points.length - 1; i++) {
        const xc = (points[i].x * w + points[i + 1].x * w) / 2;
        const yc = (points[i].y * h + points[i + 1].y * h) / 2;
        ctx.quadraticCurveTo(points[i].x * w, points[i].y * h, xc, yc);
      }

      const lastIdx = points.length - 1;
      ctx.lineTo(points[lastIdx].x * w, points[lastIdx].y * h);
      ctx.stroke();
      ctx.restore();
    }

    function eraseStrokeAt(normX, normY) {
      const strokes = pageStrokes[currentPage] || [];
      const threshold = 0.035; // 3.5% radius hit test
      
      const remaining = strokes.filter(stroke => {
        const hit = stroke.points.some(p => Math.hypot(p.x - normX, p.y - normY) < threshold);
        return !hit;
      });

      if (remaining.length !== strokes.length) {
        pageStrokes[currentPage] = remaining;
        redrawCurrentPageStrokes();
        broadcastEvent('page_strokes_sync', { page: currentPage, strokes: remaining });
      }
    }

    function undoLastStroke() {
      const strokes = pageStrokes[currentPage] || [];
      if (strokes.length > 0) {
        strokes.pop();
        redrawCurrentPageStrokes();
        broadcastEvent('page_strokes_sync', { page: currentPage, strokes: strokes });
      }
    }

    function clearCurrentPageStrokes() {
      pageStrokes[currentPage] = [];
      redrawCurrentPageStrokes();
      broadcastEvent('page_strokes_sync', { page: currentPage, strokes: [] });
    }

    function updateLaserPointer(normX, normY) {
      const rect = drawCanvas.getBoundingClientRect();
      const pixelX = normX * rect.width;
      const pixelY = normY * rect.height;

      laserElement.style.left = pixelX + 'px';
      laserElement.style.top = pixelY + 'px';
      laserElement.classList.remove('hidden');
    }

    // Attach Event Listeners to Drawing Canvas
    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', drawMove);
    window.addEventListener('mouseup', endDrawing);

    drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    drawCanvas.addEventListener('touchmove', drawMove, { passive: false });
    window.addEventListener('touchend', endDrawing);

    // ---------------------------------------------------------------------------
    // 5. REALTIME SYNC (SUPABASE BROADCAST)
    // ---------------------------------------------------------------------------
    function initRealtimeSync() {
      if (!supabaseClient) return;

      realtimeChannel = supabaseClient.channel(`talaqqi_pdf_${orgId}`, {
        config: { broadcast: { self: false } }
      });

      realtimeChannel
        .on('broadcast', { event: 'pdf_sync' }, payload => {
          handleIncomingSync(payload.payload);
        })
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            console.log('[Wasl PDF] Terhubung ke Realtime Room:', orgId);
            document.getElementById('sync-badge').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Terhubung Live';
            
            // Santri minta sync status awal dari Guru
            if (!isGuru) {
              broadcastEvent('request_state', {});
            }
          }
        });
    }

    function broadcastEvent(action, data) {
      if (!realtimeChannel) return;
      realtimeChannel.send({
        type: 'broadcast',
        event: 'pdf_sync',
        payload: {
          action: action,
          senderRole: userRole,
          timestamp: Date.now(),
          ...data
        }
      });
    }

    function handleIncomingSync(data) {
      if (!data || !data.action) return;

      switch (data.action) {
        case 'page_change':
          if (!isGuru && data.page && data.page !== currentPage) {
            currentPage = data.page;
            renderPage(currentPage);
          }
          break;

        case 'stroke_add':
          if (!isGuru && data.stroke && data.page) {
            if (!pageStrokes[data.page]) pageStrokes[data.page] = [];
            pageStrokes[data.page].push(data.stroke);
            if (data.page === currentPage) {
              redrawCurrentPageStrokes();
            }
          }
          break;

        case 'page_strokes_sync':
          if (!isGuru && data.page) {
            pageStrokes[data.page] = data.strokes || [];
            if (data.page === currentPage) {
              redrawCurrentPageStrokes();
            }
          }
          break;

        case 'laser_move':
          if (!isGuru) {
            if (data.active) {
              updateLaserPointer(data.x, data.y);
            } else {
              laserElement.classList.add('hidden');
            }
          }
          break;

        case 'request_state':
          if (isGuru) {
            broadcastEvent('state_response', {
              currentPage: currentPage,
              totalPages: totalPages,
              allStrokes: pageStrokes
            });
          }
          break;

        case 'state_response':
          if (!isGuru) {
            if (data.allStrokes) pageStrokes = data.allStrokes;
            if (data.currentPage && data.currentPage !== currentPage) {
              currentPage = data.currentPage;
              renderPage(currentPage);
            } else {
              redrawCurrentPageStrokes();
            }
          }
          break;
      }
    }

    // ---------------------------------------------------------------------------
    // 6. INITIAL BLANK WHITE CANVAS (KANVAS POLOS PUTIH BERSIH TANPA TULISAN)
    // ---------------------------------------------------------------------------
    function createBlankWhiteCanvas() {
      showLoading(false);
      const w = 595;
      const h = 842; // Standar Rasio Kertas A4 Portrait
      const dpr = 1.5;

      pdfCanvas.width = w * dpr;
      pdfCanvas.height = h * dpr;
      pdfCanvas.style.width = w + 'px';
      pdfCanvas.style.height = h + 'px';

      drawCanvas.width = w * dpr;
      drawCanvas.height = h * dpr;
      drawCanvas.style.width = w + 'px';
      drawCanvas.style.height = h + 'px';

      viewportContainer.style.width = w + 'px';
      viewportContainer.style.height = h + 'px';

      pdfCtx.save();
      pdfCtx.scale(dpr, dpr);
      
      // Latar Belakang Kanvas Putih Bersih Tanpa Tulisan
      pdfCtx.fillStyle = '#FFFFFF';
      pdfCtx.fillRect(0, 0, w, h);

      pdfCtx.restore();
      redrawCurrentPageStrokes();
    }

    // ---------------------------------------------------------------------------
    // 7. TOOLBAR UI INTERACTIONS
    // ---------------------------------------------------------------------------
    // Tool Buttons
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTool = btn.dataset.tool;

        if (activeTool === 'hand') {
          drawCanvas.style.cursor = 'grab';
        } else if (activeTool === 'laser') {
          drawCanvas.style.cursor = 'crosshair';
        } else if (activeTool === 'eraser') {
          drawCanvas.style.cursor = 'cell';
        } else {
          drawCanvas.style.cursor = 'crosshair';
        }
      });
    });

    // Color Palette
    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => {
          d.classList.remove('scale-110', 'ring-2');
          d.classList.add('ring-1');
        });
        dot.classList.add('scale-110', 'ring-2');
        dot.classList.remove('ring-1');
        activeColor = dot.dataset.color;
      });
    });

    // Page Buttons
    btnPrevPage.addEventListener('click', () => goToPage(currentPage - 1));
    btnNextPage.addEventListener('click', () => goToPage(currentPage + 1));

    // Zoom Buttons
    btnZoomIn.addEventListener('click', () => {
      currentScale = Math.min(2.0, currentScale + 0.15);
      renderPage(currentPage);
    });
    btnZoomOut.addEventListener('click', () => {
      currentScale = Math.max(0.75, currentScale - 0.15);
      renderPage(currentPage);
    });

    // Undo & Clear
    document.getElementById('btn-undo').addEventListener('click', undoLastStroke);
    document.getElementById('btn-clear-page').addEventListener('click', clearCurrentPageStrokes);

    // File Upload Handler (Guru)
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        document.getElementById('doc-title').textContent = file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
          const arrayBuffer = evt.target.result;
          loadPdfDocument(new Uint8Array(arrayBuffer));
        };
        reader.readAsArrayBuffer(file);
      }
    });

    // Resize Handler with Debounce
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (pdfDoc) renderPage(currentPage);
      }, 200);
    });

    // ---------------------------------------------------------------------------
    // 8. INITIAL BOOTSTRAP
    // ---------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      initRealtimeSync();

      if (initialDocUrl && initialDocUrl.startsWith('http')) {
        loadPdfDocument(initialDocUrl);
      } else {
        createBlankWhiteCanvas();
      }
    });
  </script>
</body>
</html>
